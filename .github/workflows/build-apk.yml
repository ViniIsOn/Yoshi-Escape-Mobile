name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Prepare original OGG music
        shell: bash
        run: |
          RAW="app/src/main/res/raw"

          # Keep the uploaded originals in Git, but give Android-valid
          # lowercase resource names inside the Actions workspace.
          mv "$RAW/EscapeMenu.ogg" "$RAW/escape_menu.ogg"
          mv "$RAW/EscapeFinalV2.ogg" "$RAW/escape_final_v2.ogg"
          mv "$RAW/EscapeLap2.ogg" "$RAW/escape_lap2.ogg"
          mv "$RAW/RunYouFool.ogg" "$RAW/run_you_fool.ogg"
          mv "$RAW/Timeisup.ogg" "$RAW/time_is_up.ogg"

          # Remove the old truncated/converted audio sources from the build.
          rm -f "$RAW/escape_menu.b64" "$RAW/escape_lap2.b64" "$RAW/run_you_fool.b64" "$RAW/die.mp3"

          test -s "$RAW/escape_menu.ogg"
          test -s "$RAW/escape_final_v2.ogg"
          test -s "$RAW/escape_lap2.ogg"
          test -s "$RAW/run_you_fool.ogg"
          test -s "$RAW/time_is_up.ogg"
          test -s "$RAW/die.ogg"

      - name: Prepare real launcher icon
        shell: bash
        run: |
          SRC="app/src/main/res/drawable-nodpi/yoshi.png"
          test -f "$SRC" || { echo "Missing launcher source: $SRC"; exit 1; }

          # Use Android resource XMLs that reference the verified Yoshi PNG.
          # This does not depend on ImageMagick being installed on the runner.
          mkdir -p app/src/main/res/mipmap app/src/main/res/mipmap-anydpi-v26

          cat > app/src/main/res/mipmap/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:drawable="@drawable/launcher_bg"/>
              <item android:left="14dp" android:top="14dp" android:right="14dp" android:bottom="14dp">
                  <bitmap android:src="@drawable/yoshi" android:gravity="center"/>
              </item>
          </layer-list>
          EOF
          cp app/src/main/res/mipmap/ic_launcher.xml app/src/main/res/mipmap/ic_launcher_round.xml

          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/launcher_bg"/>
              <foreground android:drawable="@drawable/launcher_yoshi"/>
          </adaptive-icon>
          EOF
          cp app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

          test -f app/src/main/res/mipmap/ic_launcher.xml
          test -f app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Yoshi-Escape-Mobile-v0.9-rebuild
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
