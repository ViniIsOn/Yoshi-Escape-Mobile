name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Decode game music
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path

          raw = Path('app/src/main/res/raw')
          tracks = ('escape_menu', 'run_you_fool', 'escape_lap2')

          for stem in tracks:
              src = raw / f'{stem}.b64'
              dst = raw / f'{stem}.mp3'
              if not src.exists():
                  if dst.exists():
                      print(f'{stem}: MP3 already present')
                      continue
                  raise FileNotFoundError(f'Missing {src}')

              # Files are plain base64 text. Strip whitespace only; do not
              # silently delete arbitrary characters, which can corrupt audio.
              data = ''.join(src.read_text(encoding='utf-8-sig').split())
              data += '=' * (-len(data) % 4)
              try:
                  decoded = base64.b64decode(data, validate=True)
              except Exception as exc:
                  raise RuntimeError(f'Invalid base64 in {src}: {exc}') from exc

              if len(decoded) < 3 or decoded[:3] != b'ID3':
                  # MP3 may also start directly with an MPEG frame sync.
                  if len(decoded) < 2 or decoded[0] != 0xFF or (decoded[1] & 0xE0) != 0xE0:
                      raise RuntimeError(f'{src} decoded, but output does not look like MP3')

              dst.write_bytes(decoded)
              print(f'{stem}: {len(decoded)} bytes -> {dst}')
          PY

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Yoshi-Escape-Mobile-v0.4-beta
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
