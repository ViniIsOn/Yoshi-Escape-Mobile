name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Prepare original OGG music
        shell: bash
        run: |
          RAW="app/src/main/res/raw"

          # Keep the uploaded originals in Git, but give Android-valid
          # lowercase resource names inside the Actions workspace.
          mv "$RAW/EscapeMenu.ogg" "$RAW/escape_menu.ogg"
          mv "$RAW/EscapeFinalV2.ogg" "$RAW/escape_final_v2.ogg"
          mv "$RAW/EscapeLap2.ogg" "$RAW/escape_lap2.ogg"
          mv "$RAW/RunYouFool.ogg" "$RAW/run_you_fool.ogg"
          mv "$RAW/Timeisup.ogg" "$RAW/time_is_up.ogg"

          # Remove the old truncated/converted audio sources from the build.
          rm -f "$RAW/escape_menu.b64" "$RAW/escape_lap2.b64" "$RAW/run_you_fool.b64" "$RAW/die.mp3"

          test -s "$RAW/escape_menu.ogg"
          test -s "$RAW/escape_final_v2.ogg"
          test -s "$RAW/escape_lap2.ogg"
          test -s "$RAW/run_you_fool.ogg"
          test -s "$RAW/time_is_up.ogg"
          test -s "$RAW/die.ogg"

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Yoshi-Escape-Mobile-v0.5-audio-fix
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
